logger:
  level: debug
http_server:
  port: 8080
  read_timeout: 10s
rate_limit:
  enabled: true
  default_rate: 1
  capacity: 1
  refill_interval: 5s
health_check:
  enabled: true
  check_interval: 10s
balancer:
  backends:
    - http://localhost:6969
    - http://localhost:6970
    - http://localhost:6971
  strategy: round_robin
