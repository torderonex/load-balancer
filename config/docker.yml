logger:
  level: debug
proxy_server:
  port: 8080
  read_timeout: 10s
api_server:
  port: 8081
  read_timeout: 10s
rate_limit:
  enabled: true
  default_rate: 1
  capacity: 1
  refill_interval: 5s
health_check:
  enabled: true
  check_interval: 10s
balancer:
  backends:
    - http://host.docker.internal:6969
    - http://host.docker.internal:6970
    - http://host.docker.internal:6971
  strategy: round_robin
